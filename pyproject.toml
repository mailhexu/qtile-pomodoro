[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtile-pomodoro"
version = "0.1.0"
description = "Persistent Pomodoro timer service for Qtile on X11"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
qtile-pomodoro = "qtile_pomodoro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qtile_pomodoro = ["py.typed"]
